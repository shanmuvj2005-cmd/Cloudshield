version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: cloudshield-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cloudshield-api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/cloudshield
      - SECRET_KEY=cloudshield-soc-secret-key-2026-secure-token
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudshield-web
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo_data:
